<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rushi Jagani, senior front-end engineer building agents that delete manual work">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0V48M0 48H48" fill="none" stroke="#E3E9F1" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="40%" cy="50%" r="80%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#FFFFFF"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity=".85"/>
  <rect width="1200" height="320" fill="url(#vig)"/>

  <text x="80" y="112" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing="3.2" fill="#B45309">SENIOR FRONT-END ENGINEER</text>
  <text x="80" y="178" font-family="system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#0B1220">Rushi Jagani</text>
  <rect x="80" y="202" width="160" height="2" fill="url(#rule)"/>
  <text x="80" y="240" font-family="system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="18" fill="#475569">Building agents that delete manual work.</text>
  <text x="80" y="268" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing=".4" fill="#7C8BA1">12 years  ·  React  ·  TypeScript  ·  agents that touch real systems</text>

  <g>
    <circle cx="980" cy="160" r="92" fill="none" stroke="#E2E8F0" stroke-width="1"/>

    <circle cx="980" cy="160" r="92" fill="none" stroke="#D97706" stroke-width="8" stroke-linecap="round" opacity=".16" stroke-dasharray="80 498">
      <animate attributeName="stroke-dashoffset" from="0" to="-578" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="160" r="92" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-dasharray="80 498">
      <animate attributeName="stroke-dashoffset" from="0" to="-578" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1072" cy="160" r="5" fill="#D97706" opacity=".25">
      <animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.04;.24;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="252" r="5" fill="#D97706" opacity=".25">
      <animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.04;.24;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="888" cy="160" r="5" fill="#D97706" opacity=".25">
      <animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.04;.24;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="68" r="5" fill="#D97706" opacity=".25">
      <animate attributeName="opacity" values=".25;1;.25;.25" keyTimes="0;.04;.24;1" dur="6s" begin="4.5s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" letter-spacing="1.8" fill="#7C8BA1">
      <text x="980" y="48" text-anchor="middle">OBSERVE</text>
      <text x="1090" y="164" text-anchor="start">DECIDE</text>
      <text x="980" y="277" text-anchor="middle">ACT</text>
      <text x="870" y="164" text-anchor="end">VALIDATE</text>
    </g>

    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="2.4" fill="#B8C2D0" text-anchor="middle">
      <text x="980" y="156">AGENT</text>
      <text x="980" y="174">LOOP</text>
    </g>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake — rushijagani-dev</title>
<meta name="description" content="Snake, played on a GitHub contribution graph.">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --grid-line: #E3E9F1;
    --empty: #EFF2F5;
    --l1: #ACEEBB;
    --l2: #4AC26B;
    --l3: #2DA44E;
    --l4: #116329;
    --text: #0B1220;
    --muted: #475569;
    --faint: #7C8BA1;
    --accent: #1A7F37;
    --border: #E2E8F0;
    --overlay: rgba(255,255,255,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1220;
      --panel: #0d1117;
      --grid-line: #1E293B;
      --empty: #151B23;
      --l1: #033A16;
      --l2: #196C2E;
      --l3: #2EA043;
      --l4: #56D364;
      --text: #E8EEF7;
      --muted: #8FA0B8;
      --faint: #5C6B84;
      --accent: #3FB950;
      --border: #22304A;
      --overlay: rgba(11,18,32,.86);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
  }

  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 20px; }

  .eyebrow {
    font-size: 11px; letter-spacing: 3.2px; color: var(--accent);
    margin: 0 0 10px;
  }
  h1 {
    font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif;
    font-size: clamp(28px, 7vw, 40px); font-weight: 700; letter-spacing: -1px;
    margin: 0 0 8px; line-height: 1.1;
  }
  .sub { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.6; }
  .rule { height: 2px; width: 120px; margin: 14px 0 0;
    background: linear-gradient(90deg, var(--accent), transparent); }

  .hud {
    display: flex; align-items: flex-end; gap: 28px;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 9px; letter-spacing: 1.8px; color: var(--faint); display: block; margin-bottom: 2px; }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .hud .spacer { margin-left: auto; }
  .speed { font-size: 10px; letter-spacing: 1.4px; color: var(--faint); }

  .board-wrap { position: relative; }
  canvas { display: block; width: 100%; height: auto; border-radius: 8px; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    background: var(--overlay);
    border-radius: 8px;
    backdrop-filter: blur(2px);
  }
  .overlay[hidden] { display: none; }
  .overlay h2 {
    font-family: system-ui, -apple-system, Helvetica, Arial, sans-serif;
    font-size: 22px; margin: 0; letter-spacing: -.3px;
  }
  .overlay p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.7; }

  button {
    font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .6px;
    color: #fff; background: var(--accent);
    border: none; border-radius: 6px; padding: 10px 22px; cursor: pointer;
    transition: filter .12s ease, transform .06s ease;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--l3); outline-offset: 3px; }

  kbd {
    font-family: inherit; font-size: 10px;
    border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 2px 6px; color: var(--muted);
  }

  .pad { display: none; grid-template-columns: repeat(3, 56px); gap: 8px; justify-content: center; }
  .pad button {
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); height: 52px; font-size: 17px; padding: 0;
  }
  .pad button:hover { filter: none; background: var(--empty); }
  .pad .b-up { grid-column: 2; }
  .pad .b-left { grid-column: 1; grid-row: 2; }
  .pad .b-down { grid-column: 2; grid-row: 2; }
  .pad .b-right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) { .pad { display: grid; } }

  footer { font-size: 11px; color: var(--faint); display: flex; gap: 14px; flex-wrap: wrap; }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">RUSHIJAGANI-DEV</p>
    <h1>Snake</h1>
    <p class="sub">Played on a contribution graph. Every apple you eat is a commit —<br>the snake grows one green square at a time.</p>
    <div class="rule"></div>
  </header>

  <div class="hud">
    <div><span class="stat-label">SCORE</span><span class="stat-value" id="score">0</span></div>
    <div><span class="stat-label">BEST</span><span class="stat-value" id="best">0</span></div>
    <div class="spacer speed" id="speed">SPEED 1</div>
  </div>

  <div class="board-wrap">
    <canvas id="board" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Ready</h2>
      <p id="ov-body">Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move.<br><kbd>Space</kbd> pauses.</p>
      <button id="ov-btn">Start</button>
    </div>
  </div>

  <div class="pad" aria-hidden="true">
    <button class="b-up"    data-dir="up">↑</button>
    <button class="b-left"  data-dir="left">←</button>
    <button class="b-down"  data-dir="down">↓</button>
    <button class="b-right" data-dir="right">→</button>
  </div>

  <footer>
    <a href="https://github.com/rushijagani-dev">← Back to profile</a>
    <span>Colours are GitHub's real contribution palette.</span>
  </footer>
</main>

<script>
(function () {
  "use strict";

  var COLS = 21, ROWS = 13, CELL = 20, GAP = 3, STEP = CELL + GAP;
  var BASE_MS = 145, MIN_MS = 70;

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var elScore = document.getElementById("score");
  var elBest = document.getElementById("best");
  var elSpeed = document.getElementById("speed");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ov-title");
  var ovBody = document.getElementById("ov-body");
  var ovBtn = document.getElementById("ov-btn");

  var W = COLS * STEP - GAP, H = ROWS * STEP - GAP;
  var palette = {};

  function readPalette() {
    var cs = getComputedStyle(document.documentElement);
    ["empty", "l1", "l2", "l3", "l4", "accent", "panel"].forEach(function (k) {
      palette[k] = cs.getPropertyValue("--" + k).trim();
    });
  }

  function fitCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.aspectRatio = W + " / " + H;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function roundRect(x, y, w, h, r) {
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function cellRect(x, y, inset) {
    inset = inset || 0;
    roundRect(x * STEP + inset, y * STEP + inset, CELL - inset * 2, CELL - inset * 2, 2);
  }

  // --- game state -------------------------------------------------------
  var snake, dir, queue, food, score, best, state, tickMs, acc, lastT, foodT;

  best = parseInt(localStorage.getItem("snake.best") || "0", 10) || 0;
  elBest.textContent = best;

  function reset() {
    snake = [{ x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = BASE_MS;
    acc = 0;
    foodT = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var hit = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { hit = true; break; }
        }
        if (!hit) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function updateHud() {
    elScore.textContent = score;
    elBest.textContent = best;
    var lvl = Math.min(9, 1 + Math.floor((BASE_MS - tickMs) / 9));
    elSpeed.textContent = "SPEED " + lvl;
  }

  function setOverlay(title, body, btn) {
    if (title === null) { overlay.hidden = true; return; }
    ovTitle.textContent = title;
    ovBody.innerHTML = body;
    ovBtn.textContent = btn;
    overlay.hidden = false;
  }

  var HELP = 'Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move.<br><kbd>Space</kbd> pauses.';

  function toReady() {
    state = "ready";
    reset();
    setOverlay("Ready", HELP, "Start");
    draw();
  }

  function start() {
    state = "playing";
    setOverlay(null);
    lastT = performance.now();
    acc = 0;
    requestAnimationFrame(loop);
  }

  function pause() {
    if (state !== "playing") return;
    state = "paused";
    setOverlay("Paused", "Score " + score + ".", "Resume");
  }

  function resume() {
    if (state !== "paused") return;
    state = "playing";
    setOverlay(null);
    lastT = performance.now();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = "over";
    if (score > best) {
      best = score;
      localStorage.setItem("snake.best", String(best));
    }
    updateHud();
    var msg = score === 0
      ? "No commits this run."
      : "You banked <b>" + score + "</b> commit" + (score === 1 ? "" : "s") + ".";
    if (score > 0 && score === best) msg += "<br>That's a personal best.";
    setOverlay("Game over", msg, "Play again");
    draw();
  }

  // --- loop -------------------------------------------------------------
  function tick() {
    var nd = queue.shift();
    if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) dir = nd;

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      tickMs = Math.max(MIN_MS, BASE_MS - score * 2.5);
      placeFood();
      updateHud();
      if (!food) return gameOver(); // board filled — perfect run
    } else {
      snake.pop();
    }
  }

  function loop(now) {
    if (state !== "playing") return;
    var dt = now - lastT;
    lastT = now;
    acc += dt;
    foodT += dt;
    var guard = 0;
    while (acc >= tickMs && state === "playing" && guard++ < 4) {
      acc -= tickMs;
      tick();
    }
    draw();
    if (state === "playing") requestAnimationFrame(loop);
  }

  // --- render -----------------------------------------------------------
  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        ctx.fillStyle = palette.empty;
        cellRect(x, y);
        ctx.fill();
      }
    }

    if (food) {
      var pulse = 1 + Math.sin(foodT / 260) * 0.14;
      var inset = (CELL - CELL * pulse) / 2;
      ctx.fillStyle = palette.l4;
      cellRect(food.x, food.y, inset);
      ctx.fill();
    }

    // may be called before the first reset(), while sizing the canvas
    if (!snake) return;

    // body shades from brightest at the head to faintest at the tail,
    // mirroring the contribution scale
    var shades = [palette.l4, palette.l3, palette.l2, palette.l1];
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = snake.length > 1 ? i / (snake.length - 1) : 0;
      var idx = Math.min(shades.length - 1, Math.round(t * (shades.length - 1)));
      ctx.fillStyle = i === 0 ? palette.l4 : shades[idx];
      cellRect(s.x, s.y);
      ctx.fill();
    }
  }

  // --- input ------------------------------------------------------------
  var KEYS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
  };
  var NAMED = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  function steer(v) {
    if (state === "ready") start();
    if (state !== "playing") return;
    if (queue.length < 2) queue.push(v);
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); steer(KEYS[k]); return; }
    if (k === " " || k === "Spacebar") {
      e.preventDefault();
      if (state === "playing") pause();
      else if (state === "paused") resume();
      else if (state === "ready") start();
      else if (state === "over") { toReady(); start(); }
    }
  });

  ovBtn.addEventListener("click", function () {
    if (state === "ready") start();
    else if (state === "paused") resume();
    else if (state === "over") { toReady(); start(); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".pad button"), function (b) {
    b.addEventListener("click", function () { steer(NAMED[b.dataset.dir]); });
  });

  var tsx = 0, tsy = 0;
  canvas.addEventListener("touchstart", function (e) {
    tsx = e.changedTouches[0].clientX; tsy = e.changedTouches[0].clientY;
  }, { passive: true });
  canvas.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tsx;
    var dy = e.changedTouches[0].clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
      if (state === "ready") start(); else if (state === "playing") pause(); else if (state === "paused") resume();
      return;
    }
    steer(Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 });
  }, { passive: true });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pause();
  });

  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () {
    readPalette(); draw();
  });
  window.addEventListener("resize", fitCanvas);

  readPalette();
  reset();      // must precede any draw(): fitCanvas() paints immediately
  fitCanvas();
  toReady();
})();
</script>
</body>
</html>

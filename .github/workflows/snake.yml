name: Generate contribution snake

on:
  schedule:
    # twice a day, so the snake keeps pace with the contribution graph
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render the snake eating the contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # snk's default snake is purple; force it to GitHub green so the
          # snake matches the cells it is eating
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%23116329
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2356d364

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
